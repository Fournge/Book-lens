
<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient for subtle depth -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#242c38" />
      <stop offset="100%" stop-color="#181e28" />
    </linearGradient>
    <!-- Golden Yellow Gradient matching the user icon -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.92" stdDeviation="2.56" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background container -->
  <rect width="128" height="128" rx="28.16" fill="url(#bgGrad)" />

  <!-- Centered Golden Open Book Emblem -->
  <g transform="translate(11.520000000000003, 11.520000000000003) scale(1.0495999999999999)" filter="url(#subtleGlow)">
    <!-- Left Page Outline -->
    <path
      d="M 47 78 C 36 74 24 74 15 76 C 13.5 76.3 12 75.2 12 73.6 L 12 25.4 C 12 24.1 13.2 23.1 14.5 22.8 C 24 20.8 36 21 47 25.5 Z"
      fill="none"
      stroke="url(#goldGrad)"
      stroke-width="7.5"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <!-- Right Page Outline -->
    <path
      d="M 53 25.5 C 64 21 76 20.8 85.5 22.8 C 86.8 23.1 88 24.1 88 25.4 L 88 73.6 C 88 75.2 86.5 76.3 85 76 C 76 74 64 74 53 78 Z"
      fill="none"
      stroke="url(#goldGrad)"
      stroke-width="7.5"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <!-- Center Spine Line with Notch -->
    <path
      d="M 50 25 L 50 82 L 47 78 M 50 82 L 53 78"
      fill="none"
      stroke="url(#goldGrad)"
      stroke-width="7.5"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </g>
</svg>